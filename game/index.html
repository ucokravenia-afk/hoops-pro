<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOOPS// PRO</title>
<style>body{margin:0;background:#040810;color:#c5d0da;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:24px}h1{color:#ffb703;letter-spacing:2px}</style>
</head><body>
<div class="box"><h1>HOOPS// PRO</h1><p id="s">Memuat game dari repositori…</p></div>
<script>
(async function(){
  const s=document.getElementById('s');
  try{
    const parts=[];
    for(let i=0;i<3;i++){
      s.textContent='Mengunduh bagian '+(i+1)+'/3…';
      const t=await (await fetch('parts/hoops.b64.'+i+'.txt')).text();
      parts.push(t.trim());
    }
    s.textContent='Mendekompresi…';
    const b64=parts.join('');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Response(bin).body.pipeThrough(ds)).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    s.innerHTML='Gagal memuat otomatis.<br>Buka HOOPS_PRO_PREMIUM.html dari download Grok.<br><small>'+e+'</small>';
  }
})();
</script>
</body></html>
